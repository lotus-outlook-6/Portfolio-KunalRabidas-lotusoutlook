<script>(()=>{
const c=document.createElement('canvas');
c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0';
document.body.prepend(c);
const gl=c.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false});
if(!gl)return;
gl.getExtension('EXT_color_buffer_float');
const P={SIM:128,DYE:768,DD:1.2,VD:2,PR:.1,IT:20,CURL:3,R:.2,F:6000};
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o};
const VS=sh(gl.VERTEX_SHADER,`#version 300 es
layout(location=0) in vec2 p;out vec2 v,l,r,t,b;uniform vec2 tx;
void main(){v=p*.5+.5;l=v-vec2(tx.x,0.);r=v+vec2(tx.x,0.);t=v+vec2(0.,tx.y);b=v-vec2(0.,tx.y);gl_Position=vec4(p,0.,1.);}`);
const mk=fs=>{const pr=gl.createProgram();gl.attachShader(pr,VS);
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;precision highp sampler2D;in vec2 v,l,r,t,b;out vec4 o;uniform vec2 tx;'+fs));
gl.linkProgram(pr);const u={};for(let i=0,n=gl.getProgramParameter(pr,gl.ACTIVE_UNIFORMS);i<n;i++){const m=gl.getActiveUniform(pr,i).name;u[m]=gl.getUniformLocation(pr,m)}return{pr,u}};
const clearP=mk('uniform sampler2D s;uniform float k;void main(){o=k*texture(s,v);}');
const dispP=mk('uniform sampler2D s;void main(){vec3 c=texture(s,v).rgb;o=vec4(c,max(c.r,max(c.g,c.b)));}');
const splatP=mk('uniform sampler2D s;uniform float a,rad;uniform vec3 col;uniform vec2 pt;void main(){vec2 d=v-pt;d.x*=a;o=vec4(texture(s,v).rgb+exp(-dot(d,d)/rad)*col,1.);}');
const advP=mk('uniform sampler2D U,S;uniform float dt,dis;void main(){vec2 co=v-dt*texture(U,v).xy*tx;o=texture(S,co)/(1.+dis*dt);}');
const divP=mk('uniform sampler2D U;void main(){float L=texture(U,l).x,R=texture(U,r).x,T=texture(U,t).y,B=texture(U,b).y;vec2 C=texture(U,v).xy;if(l.x<0.)L=-C.x;if(r.x>1.)R=-C.x;if(t.y>1.)T=-C.y;if(b.y<0.)B=-C.y;o=vec4(.5*(R-L+T-B),0.,0.,1.);}');
const curlP=mk('uniform sampler2D U;void main(){float L=texture(U,l).y,R=texture(U,r).y,T=texture(U,t).x,B=texture(U,b).x;o=vec4(.5*(R-L-T+B),0.,0.,1.);}');
const vortP=mk('uniform sampler2D U,C;uniform float cu,dt;void main(){float L=texture(C,l).x,R=texture(C,r).x,T=texture(C,t).x,B=texture(C,b).x,K=texture(C,v).x;vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+.0001;f*=cu*K;f.y*=-1.;o=vec4(clamp(texture(U,v).xy+f*dt,-1000.,1000.),0.,1.);}');
const presP=mk('uniform sampler2D Pr,D;void main(){float L=texture(Pr,l).x,R=texture(Pr,r).x,T=texture(Pr,t).x,B=texture(Pr,b).x;o=vec4((L+R+B+T-texture(D,v).x)*.25,0.,0.,1.);}');
const gradP=mk('uniform sampler2D Pr,U;void main(){float L=texture(Pr,l).x,R=texture(Pr,r).x,T=texture(Pr,t).x,B=texture(Pr,b).x;o=vec4(texture(U,v).xy-vec2(R-L,T-B),0.,1.);}');
gl.bindVertexArray(gl.createVertexArray());
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,-1,1,1,1,1,-1]),gl.STATIC_DRAW);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,0,2,3]),gl.STATIC_DRAW);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);
const fbo=(w,h)=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR));
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);return{t,f,w,h}};
const dbl=(w,h)=>{let a=fbo(w,h),b=fbo(w,h);return{get read(){return a},get write(){return b},swap(){[a,b]=[b,a]}}};
let vel,dye,pres,div,curl,aspect=1;
const size=r=>{const a=Math.max(aspect,1/aspect);return aspect>1?[Math.round(r*a),r]:[r,Math.round(r*a)]};
const build=()=>{const d=Math.min(devicePixelRatio||1,1.5);c.width=Math.floor(innerWidth*d);c.height=Math.floor(innerHeight*d);aspect=c.width/c.height;
const[sw,sh2]=size(P.SIM),[dw,dh]=size(P.DYE);vel=dbl(sw,sh2);dye=dbl(dw,dh);pres=dbl(sw,sh2);div=fbo(sw,sh2);curl=fbo(sw,sh2)};

const step=dt=>{
run(curlP,{U:vel.read},curl);
run(vortP,{U:vel.read,C:curl,cu:P.CURL,dt},vel.write);vel.swap();
run(divP,{U:vel.read},div);
run(clearP,{s:pres.read,k:P.PR},pres.write);pres.swap();
for(let i=0;i<P.IT;i++){run(presP,{Pr:pres.read,D:div},pres.write);pres.swap()}

const vt=[1/vel.read.w,1/vel.read.h];
run(advP,{U:vel.read,S:vel.read,tx:vt,dt,dis:P.VD},vel.write);vel.swap();
run(advP,{U:vel.read,S:dye.read,tx:vt,dt,dis:P.DD},dye.write);dye.swap()};
const splat=(x,y,dx,dy,col)=>{const rad=P.R/100*(aspect>1?aspect:1);
run(splatP,{s:vel.read,a:aspect,rad,col:[dx,dy,0],pt:[x,y]},vel.write);vel.swap();

const hsv=(h,s,v)=>{const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
return[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6]};
const gen=()=>hsv(Math.random(),1,1).map(x=>x*.2);
let col=gen(),ct=0,pm=null;
addEventListener('pointermove',e=>{const x=e.clientX/innerWidth,y=1-e.clientY/innerHeight;
if(!pm){pm=[x,y];return}
let dx=x-pm[0],dy=y-pm[1];pm=[x,y];if(aspect<1)dx*=aspect;if(aspect>1)dy/=aspect;
if(!dx&&!dy)return;splat(x,y,dx*P.F,dy*P.F,col)});
addEventListener('resize',build);build();
setTimeout(()=>{
  splat(.48,.46,160,-60,hsv(.58,.85,1).map(x=>x*.25));
  splat(.52,.42,-130,70,hsv(.85,.8,1).map(x=>x*.25));
  splat(.50,.36,50,-110,hsv(.22,.85,1).map(x=>x*.25));
},200);
let last=performance.now();
(function loop(){const now=performance.now(),dt=Math.min((now-last)/1000,.016666);last=now;
ct+=dt*10;if(ct>=1){ct%=1;col=gen()}
step(dt);gl.clearColor(0,0,0,0);gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.clear(gl.COLOR_BUFFER_BIT);
run(dispP,{s:dye.read},null);requestAnimationFrame(loop)})();
})();
